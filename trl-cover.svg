<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">TRL — Get your time back</title>
  <desc id="desc">A premium dark-green visual for The Right Lifestyle, a founder-led business systems studio in Pakistan. The right-side panel illustrates a WhatsApp-to-workflow-to-owner automation example.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06120d"/>
      <stop offset="0.55" stop-color="#071711"/>
      <stop offset="1" stop-color="#06100e"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a2ff68"/>
      <stop offset="0.55" stop-color="#32e38c"/>
      <stop offset="1" stop-color="#22bfa0"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a3ff68"/>
      <stop offset="1" stop-color="#24d99c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#21e86d" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#21e86d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10251a"/>
      <stop offset="1" stop-color="#09140f"/>
    </linearGradient>
